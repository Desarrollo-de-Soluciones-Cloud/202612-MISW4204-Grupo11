name: Build

on:
  pull_request:
    branches:
      - develop
      - main
      - "release/**"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -v -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: "postgres://app:app@localhost:5432/app?sslmode=disable"

      - name: Generate coverage report
        run: |
          if [ -f coverage.out ]; then
            go tool cover -html=coverage.out -o coverage.html
          else
            echo "No coverage.out found, skipping coverage report"
          fi
        if: always()

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: ignore

      - name: Build
        run: go build -o app ./cmd/api

  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Gate Diagnostics
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          report_file=".scannerwork/report-task.txt"
          if [ ! -f "$report_file" ]; then
            echo "No $report_file found; skipping diagnostics"
            exit 0
          fi

          ce_task_url=$(grep '^ceTaskUrl=' "$report_file" | cut -d'=' -f2-)
          if [ -z "${ce_task_url:-}" ]; then
            echo "No ceTaskUrl found in $report_file"
            exit 0
          fi

          analysis_id=$(curl -sS -u "${SONAR_TOKEN}:" "$ce_task_url" | python3 -c "import sys,json; print(json.load(sys.stdin).get('task',{}).get('analysisId',''))")
          if [ -z "${analysis_id:-}" ]; then
            echo "Analysis ID not available yet; skipping diagnostics"
            exit 0
          fi

          curl -sS -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?analysisId=${analysis_id}" > qg.json
          python3 - <<'PY'
import json

with open("qg.json", "r", encoding="utf-8") as f:
    data = json.load(f)

status = data.get("projectStatus", {}).get("status", "UNKNOWN")
print(f"Quality Gate status: {status}")
for cond in data.get("projectStatus", {}).get("conditions", []):
    metric = cond.get("metricKey")
    cstatus = cond.get("status")
    actual = cond.get("actualValue")
    comparator = cond.get("comparator")
    threshold = cond.get("errorThreshold")
    print(f"- {metric}: {cstatus} (actual={actual} {comparator} threshold={threshold})")
PY