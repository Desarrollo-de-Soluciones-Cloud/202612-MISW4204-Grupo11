  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage

      - name: Verify coverage file
        run: |
          pwd
          ls -la
          test -f coverage.out && echo "coverage.out exists" || echo "coverage.out missing"
          head -n 5 coverage.out || true

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Print SonarQube Quality Gate details
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -e

          echo "=== SonarQube diagnostic ==="

          if [ ! -f ".scannerwork/report-task.txt" ]; then
            echo "No se encontró .scannerwork/report-task.txt"
            exit 0
          fi

          cat .scannerwork/report-task.txt

          CE_TASK_ID=$(grep '^ceTaskId=' .scannerwork/report-task.txt | cut -d'=' -f2)
          SERVER_URL=$(grep '^serverUrl=' .scannerwork/report-task.txt | cut -d'=' -f2)

          if [ -z "$SERVER_URL" ]; then
            SERVER_URL="$SONAR_HOST_URL"
          fi

          echo "Server URL: $SERVER_URL"
          echo "CE Task ID: $CE_TASK_ID"

          for i in {1..30}; do
            CE_RESPONSE=$(curl -s -H "Authorization: Bearer $SONAR_TOKEN" \
              "$SERVER_URL/api/ce/task?id=$CE_TASK_ID")

            CE_STATUS=$(echo "$CE_RESPONSE" | jq -r '.task.status')
            ANALYSIS_ID=$(echo "$CE_RESPONSE" | jq -r '.task.analysisId // empty')

            echo "Intento $i - CE status: $CE_STATUS"

            if [ "$CE_STATUS" = "SUCCESS" ]; then
              break
            fi

            if [ "$CE_STATUS" = "FAILED" ] || [ "$CE_STATUS" = "CANCELED" ]; then
              echo "$CE_RESPONSE" | jq .
              exit 0
            fi

            sleep 10
          done

          if [ -z "$ANALYSIS_ID" ]; then
            echo "No se pudo obtener analysisId."
            echo "$CE_RESPONSE" | jq .
            exit 0
          fi

          QG_RESPONSE=$(curl -s -H "Authorization: Bearer $SONAR_TOKEN" \
            "$SERVER_URL/api/qualitygates/project_status?analysisId=$ANALYSIS_ID")

          echo "=== Quality Gate completo ==="
          echo "$QG_RESPONSE" | jq .

          echo "=== Condiciones evaluadas ==="
          echo "$QG_RESPONSE" | jq -r '
            .projectStatus.conditions[]
            | "- Métrica: \(.metricKey) | Estado: \(.status) | Valor actual: \(.actualValue // "N/A") | Umbral: \(.comparator // "") \(.errorThreshold // "N/A")"
          '

          echo "Quality Gate Status:"
          echo "$QG_RESPONSE" | jq -r '.projectStatus.status'

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}